<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Data Engineer Job Market Analysis - Exploratory Data Analysis with SQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 34px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; opacity: 0; animation: fadeUp 0.8s ease-out 0.2s forwards; }
    .sub   { font: 400 17px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; opacity: 0; animation: fadeUp 0.8s ease-out 0.6s forwards; }
    .tag   { font: 600 13px 'Consolas', 'Courier New', monospace; fill: #38bdf8; opacity: 0; animation: fadeUp 0.8s ease-out 1s forwards; }
    .line  { stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 1.2s ease-out 0.4s forwards; }
    .b     { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 0.9s cubic-bezier(.2,.8,.2,1) forwards, pulse 3s ease-in-out infinite; }
    .b1 { animation-delay: 0.5s, 1.5s; } .b2 { animation-delay: 0.65s, 1.8s; } .b3 { animation-delay: 0.8s, 2.1s; }
    .b4 { animation-delay: 0.95s, 2.4s; } .b5 { animation-delay: 1.1s, 2.7s; } .b6 { animation-delay: 1.25s, 3s; }
    .trend { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s ease-out 1.4s forwards; }
    .dot { opacity: 0; animation: pop 0.4s ease-out 2.6s forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { opacity: 1; } }
  </style>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>

  <text x="48" y="92" class="title">Data Engineer Job Market Analysis</text>
  <line x1="48" y1="112" x2="368" y2="112" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="line"/>
  <text x="48" y="146" class="sub">Exploratory Data Analysis with SQL · DuckDB · MotherDuck</text>
  <text x="48" y="186" class="tag">SELECT skills, demand, salary FROM job_market;</text>

  <g transform="translate(640 40)">
    <rect class="b b1" x="0"   y="110" width="26" height="50"  rx="4" fill="url(#bar)"/>
    <rect class="b b2" x="36"  y="85"  width="26" height="75"  rx="4" fill="url(#bar)"/>
    <rect class="b b3" x="72"  y="95"  width="26" height="65"  rx="4" fill="url(#bar)"/>
    <rect class="b b4" x="108" y="60"  width="26" height="100" rx="4" fill="url(#bar)"/>
    <rect class="b b5" x="144" y="40"  width="26" height="120" rx="4" fill="url(#bar)"/>
    <rect class="b b6" x="180" y="15"  width="26" height="145" rx="4" fill="url(#bar)"/>
    <polyline class="trend" points="13,98 49,73 85,83 121,48 157,28 193,3" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="193" cy="3" r="5" fill="#a78bfa"/>
    <line x1="-6" y1="160" x2="214" y2="160" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
